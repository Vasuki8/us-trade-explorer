name: Checks
on:
  pull_request:
  push:
    branches: [main, feat/public-mvp]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
env:
  ASTRO_TELEMETRY_DISABLED: '1'
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - run: npm ci --ignore-scripts
      - run: npm run test
      - run: python -m unittest discover -s pipeline/tests -v
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - name: Verify configured base path
        run: npm run build
        env:
          BASE_PATH: /us-trade-explorer/
          SITE_URL: https://vasuki8.github.io
      - name: Exercise GitHub project-path journeys
        run: npx playwright test
        env:
          BASE_PATH: /us-trade-explorer/
      - name: Production publication must remain blocked
        run: |
          if PUBLICATION_MODE=production npm run build > /tmp/production-gate.log 2>&1; then
            echo 'Unexpected production build success'
            exit 1
          fi
          grep -q 'Production publication is disabled' /tmp/production-gate.log
      # No secrets, cloud credentials, deploy step or privileged workflow_run consumer.
