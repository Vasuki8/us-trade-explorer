name: Acquire archived Census batch
on:
  workflow_dispatch:
    inputs:
      plan:
        description: 'Reviewed singleton scope whose exact responses will be privately archived'
        required: true
        default: markets
        type: choice
        options: [markets, world-controls]
      resume_run:
        description: 'Optional completed main archived-batch run ID; normalized-only runs are not accepted'
        required: false
        type: string
      refresh:
        description: 'Re-fetch every slot in the selected plan; leave false to resume unfinished work'
        required: true
        default: false
        type: boolean
permissions:
  contents: read
  actions: read
concurrency:
  group: census-acquisition
  cancel-in-progress: false
jobs:
  acquire:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && toJSON(github.event.repository.private) == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: census-ingestion
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Acquire or recover a reviewed raw-response archive
        id: acquire
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          REQUEST_PLAN: ${{ inputs.plan }}
          REQUEST_RESUME: ${{ inputs.resume_run }}
          REQUEST_REFRESH: ${{ inputs.refresh }}
        run: |
          case "$REQUEST_PLAN" in
            markets) plan_path=sources/batches/coffee-markets-2026-07.json ;;
            world-controls) plan_path=sources/batches/coffee-world-2026-07.json ;;
            *) echo 'Invalid reviewed plan'; exit 1 ;;
          esac
          args=(--plan "$plan_path" --output pipeline/output/archive)
          if [[ -n "$REQUEST_RESUME" ]]; then
            if [[ ! "$REQUEST_RESUME" =~ ^[1-9][0-9]{0,19}$ ]]; then
              echo 'Invalid prior archived-batch run ID'
              exit 1
            fi
            args+=(--resume-run "$REQUEST_RESUME")
          fi
          if [[ "$REQUEST_REFRESH" == 'true' ]]; then args+=(--refresh); fi
          python -m pipeline.archive "${args[@]}"
      - name: Preserve secret-checked private evidence, including partial failure
        if: ${{ always() && steps.acquire.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: census-archive-${{ github.run_id }}
          path: |
            pipeline/output/archive/
            !pipeline/output/archive/**/.pending-*
            !pipeline/output/archive/**/batch.lock
          if-no-files-found: warn
          retention-days: 7
      # Raw responses never enter a public build or activate a public release.
