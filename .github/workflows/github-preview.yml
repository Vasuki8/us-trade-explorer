name: GitHub development preview
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: github-development-preview
  cancel-in-progress: false
env:
  ASTRO_TELEMETRY_DISABLED: '1'
  SITE_URL: https://vasuki8.github.io
  BASE_PATH: /us-trade-explorer/
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - name: Save the sample-only downloadable preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: development-preview-${{ github.sha }}
          path: dist/
          retention-days: 14
          if-no-files-found: error
      - name: Prepare Pages artifact when hosting is enabled
        if: vars.ENABLE_GITHUB_PAGES_PREVIEW == 'true'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist/
  deploy:
    if: vars.ENABLE_GITHUB_PAGES_PREVIEW == 'true' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
